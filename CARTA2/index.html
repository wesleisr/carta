<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>As Chaves do Coração ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>

<!-- TELA INICIAL -->

<section id="startScreen">

    <h1>❤️ Nossa Jornada ❤️</h1>

    <h2>As Chaves do Coração</h2>

    <button id="startBtn">
        START GAME
    </button>

</section>

<!-- JOGO -->

<section id="gameScreen">

    <div id="phaseInfo">
        FASE 1 / 15
    </div>

    <canvas id="mazeCanvas"></canvas>

<div id="controls">

    <button class="control-btn up" id="upBtn">▲</button>

    <button class="control-btn left" id="leftBtn">◀</button>

    <div class="dpad-center"></div>

    <button class="control-btn right" id="rightBtn">▶</button>

    <button class="control-btn down" id="downBtn">▼</button>

</div>

</section>

<!-- MEMÓRIA DESBLOQUEADA -->

<section id="memoryScreen">

    <h2>❤️ Memória Desbloqueada</h2>

    <img id="memoryPhoto">

    <h3 id="memoryTitle"></h3>

    <p id="memoryText"></p>

    <button id="nextPhaseBtn">
        Próxima Fase
    </button>

</section>

<!-- CARTA FINAL -->

<section id="finalScreen">

    <h1>💌 Carta Final</h1>

    <p>
        SUA CARTA VAI AQUI
    </p>

    <button id="finishBtn">
        Fim!
    </button>

</section>

<!-- CONQUISTA -->

<section id="victoryScreen">

    <h1>🏆 CONQUISTA DESBLOQUEADA</h1>

    <h2>
        Você encontrou todas as Chaves do Meu Coração ❤️
    </h2>
    
    <button onclick="document.getElementById('bgMusic').play()">
    🎵 Tocar Música
</button>

</section>

<script src="script.js"></script>
<audio id="bgMusic" loop>

    <source
    src="audio/musica.mp3"
    type="audio/mpeg">

</audio>

</body>
</html>
